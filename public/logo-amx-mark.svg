<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="geometricPrecision" role="img" aria-labelledby="amx-logo-title">
  <title id="amx-logo-title">AMX Web Solutions</title>
  <defs>
    <linearGradient id="amx-cyan" x1="18%" y1="12%" x2="82%" y2="88%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="#030a12"/>
  <circle cx="50" cy="50" r="47" fill="#0a1628"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#amx-cyan)" stroke-opacity="0.22" stroke-width="0.55"/>
  <!-- Globe grid -->
  <g fill="none" stroke="url(#amx-cyan)" stroke-linecap="round" opacity="0.42">
    <ellipse cx="50" cy="50" rx="35" ry="35" stroke-width="0.38"/>
    <ellipse cx="50" cy="50" rx="13" ry="35" stroke-width="0.32"/>
    <ellipse cx="50" cy="50" rx="35" ry="13" stroke-width="0.32"/>
    <path d="M15 50h70M50 15v70" stroke-width="0.28" opacity="0.75"/>
  </g>
  <!-- X + nodos (red) -->
  <g stroke="url(#amx-cyan)" stroke-width="1.85" stroke-linecap="round">
    <line x1="50" y1="50" x2="24" y2="24"/>
    <line x1="50" y1="50" x2="76" y2="24"/>
    <line x1="50" y1="50" x2="24" y2="76"/>
    <line x1="50" y1="50" x2="76" y2="76"/>
  </g>
  <g fill="url(#amx-cyan)">
    <circle cx="24" cy="24" r="2.85"/>
    <circle cx="76" cy="24" r="2.85"/>
    <circle cx="24" cy="76" r="2.85"/>
    <circle cx="76" cy="76" r="2.85"/>
  </g>
  <!-- M (arriba) -->
  <path
    d="M 29 40 V 25.5 L 39.5 33.2 L 50 25.5 L 60.5 33.2 L 71 25.5 V 40"
    fill="none"
    stroke="url(#amx-cyan)"
